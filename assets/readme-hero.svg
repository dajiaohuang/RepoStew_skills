<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">RepoStew</title>
  <desc id="desc">把贡献做成维护闭环 — Responsible repository stewardship</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#28384f" stroke-width="1" opacity=".55"/>
    </pattern>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#315efb"/><stop offset="1" stop-color="#22b88a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#0b1424"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="58" y="54" width="7" height="212" fill="url(#rail)"/>
  <circle cx="62" cy="56" r="14" fill="#ffb11b" stroke="#0b1424" stroke-width="5"/>
  <text x="94" y="95" fill="#90a4bf" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3">REPOSITORY MAINTENANCE PROTOCOL</text>
